<!doctype html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>flow-select integration - Bootstrap layout</title>
  <link rel="stylesheet" href="/node_modules/bootstrap/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="/dist/flow-select.css">
  <script src="/dist/flow-select.js"></script>
</head>
<body class="p-4">
<div class="container" style="max-width: 640px">
  <label class="form-label" for="bs-plain">Plain form-select</label>
  <select id="bs-plain" name="bsPlain" class="form-select" data-flow-select>
    <option value="1">One</option>
    <option value="2">Two</option>
  </select>
  <p id="after-plain" class="mt-3">After the plain select.</p>
  <label class="form-label" for="bs-margin">form-select with mb-3</label>
  <select id="bs-margin" name="bsMargin" class="form-select mb-3" data-flow-select>
    <option value="1">One</option>
    <option value="2">Two</option>
  </select>
  <p id="after-margin">After the select with a margin utility.</p>
  <label class="form-label" for="bs-width">form-select with w-50</label>
  <select id="bs-width" name="bsWidth" class="form-select w-50" data-flow-select>
    <option value="1">One</option>
    <option value="2">Two</option>
  </select>
  <p id="after-width">After the select with a width utility.</p>
</div>
</body>
</html>
